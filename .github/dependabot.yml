version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/docconv"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "docconv"
    groups:
      dev-tools:
        patterns: ["ruff", "ty", "pytest*", "pymarkdownlnt"]

  - package-ecosystem: "docker"
    directory: "/docconv"
    schedule:
      interval: "monthly"
    ignore:
      # The Python minor version is pinned project-wide (.python-version,
      # requires-python, ruff, ty); change it by hand, not per file.
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    commit-message:
      prefix: "docconv"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "ci"
    groups:
      # Actions are pinned by SHA, so each bump is an opaque hash: review them together.
      actions:
        patterns: ["*"]

  # Remote hooks only; the local POC hooks take their versions from each uv.lock.
  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "pre-commit"
    groups:
      hooks:
        patterns: ["*"]
