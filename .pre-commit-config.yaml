# Hooks for the whole monorepo. POC-specific hooks are local, filtered by folder,
# and run that POC's `make lint`: its tools come from the POC's uv.lock (Dependabot
# updates them in one place) and the commands are the ones CI runs.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      # Generated fixtures are never edited, not even by hooks.
      - id: end-of-file-fixer
        exclude: ^docconv/tests/fixtures/
      - id: trailing-whitespace
        exclude: ^docconv/tests/fixtures/
        # Two trailing spaces are a hard line break in Markdown.
        args: [--markdown-linebreak-ext=md]
      - id: check-added-large-files
        args: ["--maxkb=3000"]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  # Workflow correctness (expressions, contexts, shellcheck on run blocks).
  - repo: https://github.com/Mateusz-Grzelinski/actionlint-py
    rev: v1.7.12.25
    hooks:
      - id: actionlint

  # Workflow security (template injection, credential persistence, pinning...). Online
  # audits run only when GH_TOKEN is set, as in CI.
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.32.0
    hooks:
      - id: zizmor

  # Shell scripts (actionlint already checks the `run:` blocks of the workflows).
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck

  - repo: local
    hooks:
      - id: docconv-lint
        name: docconv lint
        language: system
        entry: make -C docconv lint
        files: ^docconv/
        pass_filenames: false
