name: scorecard

# OpenSSF Scorecard: scores the repository's security practices and reports each
# finding as a code scanning alert (Security tab), so a setting that drifts shows up.
# The action rejects publishing from workflows with top-level env, defaults or write
# permissions, or with run steps in this job.
on:
  push:
    branches: [main]
  # Weekly: scores change with repository settings, not only with code.
  schedule:
    - cron: "27 5 * * 1"
  branch_protection_rule:

permissions: read-all

jobs:
  analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write # upload the results as code scanning alerts
      id-token: write # publish the results to the OpenSSF API (badge)
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@v4.39.1
        with:
          sarif_file: results.sarif
