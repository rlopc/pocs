version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/docconv"
    schedule:
      interval: "monthly"
    # Let a release age a week before adopting it, so a compromised or broken one is
    # likely to be yanked first. Dependabot's own default is 3 days; security updates
    # are never delayed.
    cooldown:
      default-days: 7
    commit-message:
      prefix: "docconv"
    groups:
      dev-tools:
        patterns: ["ruff", "ty", "pytest*", "pymarkdownlnt"]
    ignore:
      # docling requires huggingface-hub<2, so every major bump fails to resolve.
      # Lift this when docling allows 2.x.
      - dependency-name: "huggingface-hub"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "docker"
    directory: "/docconv"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    ignore:
      # The Python minor version is pinned project-wide (.python-version,
      # requires-python, ruff, ty); change it by hand, not per file.
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    commit-message:
      prefix: "docconv"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "ci"
    groups:
      # Actions are pinned by SHA, so each bump is an opaque hash: review them together.
      actions:
        patterns: ["*"]

  # Remote hooks only; the local POC hooks take their versions from each uv.lock.
  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "pre-commit"
    groups:
      hooks:
        patterns: ["*"]

  # The integrations/github provider version locked in infra/github/.terraform.lock.hcl.
  - package-ecosystem: "terraform"
    directory: "/infra/github"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "repo"
