name: docconv

on:
  push:
    # Other branches are covered by their pull request; avoids duplicate runs.
    branches: [main]
    paths: ["docconv/**", ".github/workflows/docconv.yml", ".github/workflows/actions.lock"]
  # No path filter here: the `docconv` gate job is required by the branch ruleset, and a
  # workflow skipped by a path filter leaves its required check pending forever. The
  # `changes` job filters by path instead; jobs skipped by `if` report success.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docconv-${{ github.event_name }}-${{ github.ref }}
  # Superseded pull request runs are cancelled; push and manual runs always finish,
  # so every commit on main gets a complete result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_VERSION: "0.13.7"
  # Every uv command fails if uv.lock no longer matches pyproject.toml, instead of
  # installing a stale lock (`--frozen`) or re-locking it.
  UV_LOCKED: "1"

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read # list the files changed by the pull request
    outputs:
      docconv: ${{ steps.filter.outputs.docconv }}
    steps:
      # Push runs are already path-filtered by the trigger; manual runs check everything.
      - id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            echo "docconv=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Captured first: `grep -q` would close the pipe early and fail `gh` on SIGPIPE.
          files=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" --paginate --jq '.[].filename')
          if grep -qE '^(docconv/|\.github/workflows/(docconv\.yml|actions\.lock)$)' <<< "$files"; then
            echo "docconv=true" >> "$GITHUB_OUTPUT"
          else
            echo "docconv=false" >> "$GITHUB_OUTPUT"
          fi

  checks:
    needs: changes
    if: needs.changes.outputs.docconv == 'true'
    runs-on: ubuntu-latest
    # Job timeouts are ~2-3x the slowest observed run, instead of GitHub's 360-minute
    # default that a hung step would burn in full.
    timeout-minutes: 10
    defaults:
      run:
        working-directory: docconv
    steps:
      # No step pushes or fetches after checkout: do not leave the token on the runner.
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          working-directory: docconv
      # Installs every dependency group (`default-groups` in pyproject.toml): ty and the
      # tests also cover tools/ and benchmark/.
      - run: uv sync
      # The same target as locally, so the checks cannot drift between the two. GitHub
      # format: ty diagnostics show up as annotations on the pull request diff.
      - run: make verify TY_FLAGS="--output-format github"

  slow:
    needs: changes
    if: needs.changes.outputs.docconv == 'true' && github.event_name != 'push'
    runs-on: ubuntu-latest
    # Extra margin: on a cache miss the models are downloaded from the network.
    timeout-minutes: 15
    defaults:
      run:
        working-directory: docconv
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          working-directory: docconv
      # Every group: pytest imports all test modules before filtering by marker, and
      # some import benchmark/ (jiwer, rapidfuzz).
      - run: uv sync
      - uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/docconv/models
          key: docconv-models-c1-${{ hashFiles('docconv/src/docconv/profiles.toml', 'docconv/uv.lock') }}
      # Only the models of C1 (standard-rapidocr): the slow tests use it.
      - run: uv run docconv models download --profile standard-rapidocr
      - run: uv run pytest -m slow --no-cov

  docker:
    needs: changes
    if: needs.changes.outputs.docconv == 'true' && github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: docconv
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      # The image bakes in several GB of models and the runner runs out of disk while
      # building it. Remove preinstalled toolchains this job does not use.
      - name: Free runner disk space
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      - run: docker build -t docconv:ci .
      - name: Smoke conversion without network
        run: |
          mkdir -p /tmp/out && chmod 777 /tmp/out
          docker run --rm --network none \
            -v "$PWD/data/inputs/real:/in:ro" -v /tmp/out:/out \
            docconv:ci convert /in/b2-week_01-02_reading-source.pdf -o /out
          test -s /tmp/out/b2-week_01-02_reading-source.md

  # The only docconv check the branch ruleset requires: one stable name per POC, so job
  # names can change and POCs do not collide. `always()` keeps it running when a needed
  # job fails, since a skipped required job would otherwise count as success.
  gate:
    name: docconv
    needs: [changes, checks, slow, docker]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "A docconv job failed or was cancelled"
          exit 1
      - run: echo "All docconv jobs passed or were skipped"
