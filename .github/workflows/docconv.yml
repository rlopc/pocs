name: docconv

on:
  push:
    # Other branches are covered by their pull request; avoids duplicate runs.
    branches: [main]
    paths: ["docconv/**", ".github/workflows/docconv.yml"]
  # No path filter: the checks are required by the branch ruleset, and a required check
  # that never runs would block pull requests that do not touch docconv.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docconv-${{ github.event_name }}-${{ github.ref }}
  # Superseded pull request runs are cancelled; push and manual runs always finish,
  # so every commit on main gets a complete result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: docconv

env:
  UV_VERSION: "0.13.7"
  # Every uv command fails if uv.lock no longer matches pyproject.toml, instead of
  # installing a stale lock (`--frozen`) or re-locking it.
  UV_LOCKED: "1"

jobs:
  checks:
    runs-on: ubuntu-latest
    # Job timeouts are ~2-3x the slowest observed run, instead of GitHub's 360-minute
    # default that a hung step would burn in full.
    timeout-minutes: 10
    steps:
      # No step pushes or fetches after checkout: do not leave the token on the runner.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          working-directory: docconv
      # Installs every dependency group (`default-groups` in pyproject.toml): ty and the
      # tests also cover tools/ and benchmark/.
      - run: uv sync
      # The Dockerfile is the reference for the uv and Python versions (Dependabot
      # updates it): fails if UV_VERSION or .python-version no longer match it.
      - run: make check-versions
      - run: uv run ruff format --check
      - run: uv run ruff check
      # GitHub format: diagnostics show up as annotations on the pull request diff.
      - run: uv run ty check --output-format github
      - run: uv run pymarkdown --strict-config --config .pymarkdown.json scan README.md benchmark/results.md data/expected/real data/expected/reserved
      - run: uv run pytest

  slow:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # Extra margin: on a cache miss the models are downloaded from the network.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          working-directory: docconv
      # Every group: pytest imports all test modules before filtering by marker, and
      # some import benchmark/ (jiwer, rapidfuzz).
      - run: uv sync
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/docconv/models
          key: docconv-models-c1-${{ hashFiles('docconv/src/docconv/profiles.toml', 'docconv/uv.lock') }}
      # Only the models of C1 (standard-rapidocr): the slow tests use it.
      - run: uv run docconv models download --profile standard-rapidocr
      - run: uv run pytest -m slow --no-cov

  docker:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The image bakes in several GB of models and the runner runs out of disk while
      # building it. Remove preinstalled toolchains this job does not use.
      - name: Free runner disk space
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      - run: docker build -t docconv:ci .
      - name: Smoke conversion without network
        run: |
          mkdir -p /tmp/out && chmod 777 /tmp/out
          docker run --rm --network none \
            -v "$PWD/data/inputs/real:/in:ro" -v /tmp/out:/out \
            docconv:ci convert /in/b2-week_01-02_reading-source.pdf -o /out
          test -s /tmp/out/b2-week_01-02_reading-source.md
