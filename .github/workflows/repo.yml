name: repo

# Repository-wide checks: the pre-commit hooks that are not specific to a POC, so they
# hold even for commits made without the hooks installed, and the static checks of the
# Terraform configuration of the GitHub settings (infra/github).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repo-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Pinned so CI does not change behaviour on a release. Dependabot does not track
  # these; bump them by hand. `make check-versions` (docconv) fails when UV_VERSION
  # differs from the uv image in the Dockerfile, which Dependabot does update.
  UV_VERSION: "0.13.7"
  PRE_COMMIT_VERSION: "4.7.0"
  PRE_COMMIT_UV_VERSION: "4.4.2"
  TERRAFORM_VERSION: "1.17.1"

jobs:
  pre-commit:
    # The check name required by the branch ruleset.
    name: repo
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
      - uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      # POC hooks are skipped: each POC's workflow runs the same `make lint` in its
      # synced environment.
      - name: Run the repository hooks
        env:
          SKIP: docconv-lint
          # Enables zizmor's online audits (known-vulnerable or impostor actions).
          GH_TOKEN: ${{ github.token }}
        run: >-
          uvx --from "pre-commit==$PRE_COMMIT_VERSION"
          --with "pre-commit-uv==$PRE_COMMIT_UV_VERSION"
          pre-commit run --all-files --show-diff-on-failure
      - uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      # Static checks only: `terraform plan` needs admin rights on the repository, which
      # the workflow token must not have. Drift is checked locally (docs/README.md).
      - name: Check the Terraform configuration
        working-directory: infra/github
        run: |
          terraform fmt -check -diff
          terraform init -backend=false -input=false
          terraform validate
